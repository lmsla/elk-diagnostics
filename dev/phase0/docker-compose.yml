# Phase 0：本機多版本 ES（+ 對應 Kibana），用於驗證 _health_report 顆粒度、擷取 fixture、
# 以及用視覺化介面交叉核對 elk-doctor 的判斷。
# 僅供本機開發，security 關閉以簡化。請勿用於正式環境。
# 版本以 .env 控制（複製 .env.example 為 .env 後調整為當前可用 tag）。
# Kibana 版本必須與其連接的 ES 完全一致，故共用同一個版本變數。
#
# 對照表：
#   es8      http://localhost:9208   |  kibana8  http://localhost:5601
#   es9      http://localhost:9209   |  kibana9  http://localhost:5602

services:
  es8:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ES8_VERSION:-8.14.3}
    container_name: elkdoctor-es8
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ulimits:
      memlock: { soft: -1, hard: -1 }
    ports:
      - "9208:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  kibana8:
    image: docker.elastic.co/kibana/kibana:${ES8_VERSION:-8.14.3}
    container_name: elkdoctor-kibana8
    environment:
      - ELASTICSEARCH_HOSTS=http://es8:9200
    ports:
      - "5601:5601"
    depends_on:
      es8:
        condition: service_healthy

  es9:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ES9_VERSION:-9.0.0}
    container_name: elkdoctor-es9
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ulimits:
      memlock: { soft: -1, hard: -1 }
    ports:
      - "9209:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  kibana9:
    image: docker.elastic.co/kibana/kibana:${ES9_VERSION:-9.0.0}
    container_name: elkdoctor-kibana9
    environment:
      - ELASTICSEARCH_HOSTS=http://es9:9200
    ports:
      - "5602:5601"
    depends_on:
      es9:
        condition: service_healthy
