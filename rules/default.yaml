# C 類診斷（_health_report 無對應 indicator、需自行採集判定連續型指標）用的可調閾值。
#
# A/B 類診斷（見 docs/內部/規格/健康報告規格.md）直接轉述 _health_report 自身的
# status/diagnosis——ES 已經替這些指標下過判斷，不是「數值 vs 閾值」的問題，
# 因此不經過這份設定檔，也不受 --rules 覆寫影響。
#
# 用 --rules custom.yaml 可覆寫下列任一欄位；未提供的欄位沿用此檔預設值。

performance:
  jvm_warn_pct: 85       # 官方：持續 >85% 應紓解
  jvm_crit_pct: 95       # parent circuit breaker 預設跳閘點
  cpu_warn_pct: 85       # 官方：>95% 持續才算問題；85 取較保守的快照預警
  queue_backlog: 50      # thread pool queue 積壓預警（瞬時值）

data:
  mapping_limit_default: 1000  # index.mapping.total_fields.limit 預設值（未讀取實際設定時的假設值）
  mapping_warn_frac: 80        # 達上限百分比預警
  ingest_fail_warn_pct: 10     # pipeline failed 百分比預警門檻（官方 heuristic）

balance:
  hotspot_spread_pct: 30       # 節點指標與中位數差距門檻

write_bottleneck:
  cpu_low_pct: 50               # CPU 偏低：排除單純算力不足
  write_queue_min: 1            # write queue 有積壓
  allocated_processors_low: 2   # allocated_processors 偏低門檻（常見於 K8s 未正確設 CPU limit）

node_context:
  fd_warn_pct: 80               # open/max file descriptors；工具 heuristic，非 Elastic 官方告警門檻
  fd_crit_pct: 90
  cgroup_memory_warn_pct: 90    # usage 含 file cache；單次快照只標 warning，不升 critical

static_health:
  pending_task_warn_seconds: 30   # cluster state task 排隊預警
  pending_task_crit_seconds: 300  # 排隊 5 分鐘視為嚴重阻塞
  long_task_warn_seconds: 300     # 長任務可能合法，單次快照只標疑似
  shard_large_warn_gb: 50         # Elastic sizing 常用上緣；非硬限制
  shard_small_max_mb: 1024        # 小 primary shard 定義
  shard_small_count_warn: 100     # 大量小 shard heuristic
  snapshot_warn_hours: 48         # 預設 RPO heuristic，可依使用者政策覆寫
  snapshot_crit_hours: 168
  expiry_warn_days: 30            # TLS／License 到期預警
  indexing_pressure_warn_pct: 80  # 當下 coordinating+primary／replica 各自相對拒絕上限
  indexing_pressure_crit_pct: 95
  recent_restart_warn_minutes: 60 # 單次快照只提示近期重啟，不推斷原因
  ccr_lag_warn_ops: 10000          # follower global checkpoint 絕對落後量；趨勢留給 Monitoring
